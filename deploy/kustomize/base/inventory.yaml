# SCATTER/GATHER: inventory-root (Go) scatters to warehouse leaves (Python + Node, identical role,
# different language = the polyglot proof), inventory-merge (Python) gathers. See CONTRACTS.md section 8.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-root
  namespace: orderforge
  labels:
    app: inventory-root
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-root
  template:
    metadata:
      labels:
        app: inventory-root
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: inventory-root
          image: orderforge/inventory-root:latest
          env:
            - name: LEAF_ENDPOINTS
              value: "http://warehouse-leaf-py:8080,http://warehouse-leaf-node:8080"
            - name: LEAF_PATH
              value: "/shard/availability"
            - name: MERGE_URL
              value: "http://inventory-merge:9090/merge"
            - name: SCATTER_TIMEOUT_MS
              value: "300"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-root
  namespace: orderforge
  labels:
    app: inventory-root
spec:
  selector:
    app: inventory-root
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
