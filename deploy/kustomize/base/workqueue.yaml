# WORK QUEUE: coordinator (Go) enqueues to redis-workqueue; worker pod = reusable framework (Go) +
# user order-stage (Node) sharing an emptyDir /work. Framework never runs user code - it orchestrates
# files (CONTRACTS.md sections 2,3,9). Fixed replicas here; KEDA queue-depth scaling is the M6 overlay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workqueue-coordinator
  namespace: orderforge
  labels:
    app: workqueue-coordinator
spec:
  replicas: 1  # single reaper owner
  selector:
    matchLabels:
      app: workqueue-coordinator
  template:
    metadata:
      labels:
        app: workqueue-coordinator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: coordinator
          image: orderforge/workqueue-coordinator:latest
          env:
            - name: REDIS_ADDR
              value: "redis-workqueue:6379"
            - name: MAX_ATTEMPTS
              value: "5"
            - name: VISIBILITY_S
              value: "30"
            - name: REAPER_INTERVAL_S
              value: "2"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: workqueue-coordinator
  namespace: orderforge
  labels:
    app: workqueue-coordinator
spec:
  selector:
    app: workqueue-coordinator
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-worker
  namespace: orderforge
  labels:
    app: order-worker
spec:
  replicas: 2  # KEDA scales this in M6
  selector:
    matchLabels:
      app: order-worker
  template:
    metadata:
      labels:
        app: order-worker
    spec:
      terminationGracePeriodSeconds: 60  # > max task time so SIGTERM'd workers finish/leave for reaper
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 128Mi
      containers:
        - name: framework  # Go, reusable, generic
          image: orderforge/workqueue-framework:latest
          env:
            - name: REDIS_ADDR
              value: "redis-workqueue:6379"
            - name: WORK_DIR
              value: "/work"
            - name: VISIBILITY_S
              value: "30"
            - name: MAX_ATTEMPTS
              value: "5"
            - name: HEARTBEAT_S
              value: "5"
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: health
              containerPort: 8091
          volumeMounts:
            - name: work
              mountPath: /work
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8091
            periodSeconds: 5
        - name: order-stage  # Node, USER business logic (shim.js + stage.js, file-in/file-out)
          image: orderforge/order-stage:latest
          env:
            - name: WORK_DIR
              value: "/work"
          volumeMounts:
            - name: work
              mountPath: /work
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
