# redis-workqueue: single-node, NON-DURABLE (emptyDir) backing store for the work queue + settlement keys.
# See docs/design/CONTRACTS.md section 1-2. A restart wipes state - acceptable for a demo, called out in the README.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-workqueue
  namespace: orderforge
  labels:
    app: redis-workqueue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-workqueue
  template:
    metadata:
      labels:
        app: redis-workqueue
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: redis
          image: public.ecr.aws/docker/library/redis:7-alpine
          # in-memory only, no persistence
          args:
            - "--save"
            - ""
            - "--appendonly"
            - "no"
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          readinessProbe:
            exec:
              command:
                - "redis-cli"
                - "ping"
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis-workqueue
  namespace: orderforge
  labels:
    app: redis-workqueue
spec:
  selector:
    app: redis-workqueue
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
